<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Week 4 Day 4 — Fetch and Grid</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
  <main class="container py-4">
    <h1>Week 4 Day 4 — Fetch and Grid</h1>
    <p><a href="../../index.html">← All practice days</a></p>

    <!-- ========== Warm-up: menu loaded from menu.json (script.js) ========== -->
    <h2 class="mt-4">Warm-up: menu from a JSON file</h2>
    <div id="menu-area" class="d-flex flex-wrap gap-3"></div>


    <!-- ========== Grid: six items ========== -->
    <h2 class="mt-5">Grid: what we sell</h2>
    <!-- TODO: give the div below these classes: row row-cols-1 row-cols-sm-2 row-cols-lg-3 g-3
         That means: 1 column on phones, 2 from small screens up, 3 from large screens up. -->
    <div class="">
      <div class="col"><div class="p-4 bg-light border">Tacos</div></div>
      <div class="col"><div class="p-4 bg-light border">Burritos</div></div>
      <div class="col"><div class="p-4 bg-light border">Nachos</div></div>
      <div class="col"><div class="p-4 bg-light border">Churros</div></div>
      <div class="col"><div class="p-4 bg-light border">Drinks</div></div>
      <div class="col"><div class="p-4 bg-light border">Specials</div></div>
    </div>
    <!-- TODO: change the six items to fit YOUR truck. -->


    <!-- ========== Extra: the same grid in plain CSS ========== -->
    <!-- If you finish early: copy the six items into the div below (without the "col" wrappers),
         then compare the plain CSS in the <style> block with the Bootstrap classes above. -->
    <h2 class="mt-5">Extra: plain CSS grid</h2>
    <div class="plain-grid"></div>
  </main>

  <style>
    .plain-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
    }
  </style>

  <script src="script.js"></script>
</body>
</html>
